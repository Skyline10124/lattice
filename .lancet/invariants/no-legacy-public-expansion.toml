id = "NO-LEGACY-EXPANSION"
title = "No legacy executor public surface expansion"
anchor = { type = "glob", value = "crates/lancet-executor/src/executor/**/*.rs" }

[[forbidden]]
category = "public_api_expansion"
reason = "The Phase 20 legacy executor backend is a private bridge scheduled for removal; new functionality must be routed through native CEP method handlers in handlers/ rather than expanding the legacy public surface"

[[opaque]]
text = "If a new CEP method requires filesystem access, add a native handler in lancet-executor/src/handlers/ and register it in native_registry.rs; do not extend the legacy executor module"
