[agent]
name = "local-hello"
model = "deepseek-v4-flash"
description = "Run a local declarative hot-plug plugin."
tags = ["local-plugin", "hot-plug"]

[system]
prompt = "Run the configured local plugin and return its output."

[handoff]
max_turns = 3

[plugins]
entry = "hello"

[[plugins.slots]]
name = "hello"
plugin = "local:hello"
max_turns = 3
behavior = { mode = "yolo" }
