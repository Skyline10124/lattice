[agent]
name = "superpowers"
model = "deepseek-v4-flash"
description = "Run the obra/superpowers development methodology through LATTICE plugins."
tags = ["superpowers", "workflow", "development"]

[system]
prompt = "You are a LATTICE pipeline wrapper for the Superpowers development methodology. Run the configured plugin DAG and return the final plugin output as JSON."

[handoff]
max_turns = 20

[plugins]
entry = "workflow"
shared_tools = ["read_file", "grep", "write_file", "list_directory", "bash", "patch"]

[[plugins.slots]]
name = "workflow"
plugin = "superpowers:workflow"
max_turns = 3
behavior = { mode = "strict", confidence_threshold = 0.6, max_retries = 2 }

[[plugins.slots]]
name = "brainstorm"
plugin = "superpowers:brainstorming"
max_turns = 6
behavior = { mode = "strict", confidence_threshold = 0.6, max_retries = 2 }

[[plugins.slots]]
name = "worktree"
plugin = "superpowers:using-git-worktrees"
max_turns = 4
behavior = { mode = "strict", confidence_threshold = 0.6, max_retries = 2 }

[[plugins.slots]]
name = "plan"
plugin = "superpowers:writing-plans"
max_turns = 6
behavior = { mode = "strict", confidence_threshold = 0.6, max_retries = 2 }

[[plugins.slots]]
name = "develop"
plugin = "superpowers:subagent-driven-development"
max_turns = 8
behavior = { mode = "strict", confidence_threshold = 0.6, max_retries = 2 }

[[plugins.slots]]
name = "execute-inline"
plugin = "superpowers:executing-plans"
max_turns = 8
behavior = { mode = "strict", confidence_threshold = 0.6, max_retries = 2 }

[[plugins.slots]]
name = "tdd"
plugin = "superpowers:test-driven-development"
max_turns = 5
behavior = { mode = "strict", confidence_threshold = 0.6, max_retries = 2 }

[[plugins.slots]]
name = "review"
plugin = "superpowers:requesting-code-review"
max_turns = 5
behavior = { mode = "strict", confidence_threshold = 0.6, max_retries = 2 }

[[plugins.slots]]
name = "verify"
plugin = "superpowers:verification-before-completion"
max_turns = 5
behavior = { mode = "strict", confidence_threshold = 0.6, max_retries = 2 }

[[plugins.slots]]
name = "finish"
plugin = "superpowers:finishing-a-development-branch"
max_turns = 5
behavior = { mode = "strict", confidence_threshold = 0.6, max_retries = 2 }

[[plugins.slots]]
name = "debug"
plugin = "superpowers:systematic-debugging"
max_turns = 6
behavior = { mode = "strict", confidence_threshold = 0.6, max_retries = 2 }

[[plugins.edges]]
from = "workflow"
rule = { condition = { field = "selected_skill", op = "contains", value = "systematic-debugging" }, target = "debug" }

[[plugins.edges]]
from = "workflow"
rule = { condition = { field = "selected_skill", op = "contains", value = "verification-before-completion" }, target = "verify" }

[[plugins.edges]]
from = "workflow"
rule = { condition = { field = "selected_skill", op = "contains", value = "finishing-a-development-branch" }, target = "finish" }

[[plugins.edges]]
from = "workflow"
rule = { condition = { field = "selected_skill", op = "contains", value = "writing-plans" }, target = "plan" }

[[plugins.edges]]
from = "workflow"
rule = { condition = { field = "selected_skill", op = "contains", value = "subagent-driven-development" }, target = "develop" }

[[plugins.edges]]
from = "workflow"
rule = { condition = { field = "selected_skill", op = "contains", value = "executing-plans" }, target = "execute-inline" }

[[plugins.edges]]
from = "workflow"
rule = { condition = { field = "selected_skill", op = "contains", value = "test-driven-development" }, target = "tdd" }

[[plugins.edges]]
from = "workflow"
rule = { condition = { field = "selected_skill", op = "contains", value = "requesting-code-review" }, target = "review" }

[[plugins.edges]]
from = "workflow"
rule = { condition = { field = "selected_skill", op = "contains", value = "using-git-worktrees" }, target = "worktree" }

[[plugins.edges]]
from = "workflow"
rule = { default = true, target = "brainstorm" }

[[plugins.edges]]
from = "brainstorm"
rule = { default = true, target = "plan" }

[[plugins.edges]]
from = "worktree"
rule = { default = true, target = "plan" }

[[plugins.edges]]
from = "plan"
rule = { default = true, target = "develop" }

[[plugins.edges]]
from = "develop"
rule = { default = true, target = "review" }

[[plugins.edges]]
from = "execute-inline"
rule = { default = true, target = "review" }

[[plugins.edges]]
from = "tdd"
rule = { default = true, target = "review" }

[[plugins.edges]]
from = "debug"
rule = { default = true, target = "verify" }

[[plugins.edges]]
from = "review"
rule = { default = true, target = "verify" }

[[plugins.edges]]
from = "verify"
rule = { default = true, target = "finish" }

[[plugins.edges]]
from = "finish"
rule = { default = true }
