<!doctype html>
<html>
<head><meta charset="utf-8"><title>Input — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* each theme pinned on its own section, so both show whichever theme the page is in */
  .theme { background: var(--paper); color: var(--ink); }
  .theme-name { margin: 0; padding: var(--space-4) var(--space-6) 0; font-family: var(--font-sans); font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .28em; color: var(--ink-muted); }
  body { margin: 0; background: var(--paper); font-family: var(--font-sans); }
  .stage { padding: var(--space-6); display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-6); }
</style>
</head>
<body>
<section class="theme" data-theme="light"><p class="theme-name">PAPER</p><div id="paper" class="stage"></div></section>
<section class="theme" data-theme="tape"><p class="theme-name">TAPE</p><div id="tape" class="stage"></div></section>
<script>
  var L = window.LatticeSignal, h = React.createElement;
  // id keeps radio names and generated ids apart between the two copies
  function demo(id) { return h(React.Fragment, null,
    h(L.Input, { label: 'Session name', placeholder: 'Nightly sync', hint: 'Shown in the sidebar.' }),
    h(L.Input, { label: 'Store path', defaultValue: '~/.lattice/session.db', mono: true }),
    h(L.Input, { label: 'Timeout', defaultValue: '0', error: 'Must be at least 1 second.' })); }
  ['paper', 'tape'].forEach(function (id) {
    ReactDOM.createRoot(document.getElementById(id), { identifierPrefix: id + '-' }).render(demo(id));
  });
</script>
</body>
</html>
