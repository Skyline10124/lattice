[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.94"

[[bin]]
name = "xtask"
path = "src/main.rs"

[features]
model-metadata = ["dep:lattice-llm", "dep:tokio"]

[dependencies]
anyhow = { workspace = true }
cargo_metadata = "0.19"
chrono = { workspace = true }
clap = { workspace = true }
lancet-protocol = { workspace = true }
lattice-llm = { workspace = true, optional = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, optional = true }
toml = { workspace = true }
toml_edit = { workspace = true }
walkdir = "2"

[dev-dependencies]
tempfile = { workspace = true }
