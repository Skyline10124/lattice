name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build -p lattice-cli --bin lattice
      # One test step covers crate-local invariants AND every external-binary
      # scenario (fast_*, direct_* full-turn, pty_tui_smoke): the harness is a
      # workspace member, resolves the debug binary via LATTICE_BIN, and none
      # of its targets are #[ignore]-gated. Direct-Local scenarios run on any
      # host — no hypervisor, daemon, or container image required.
      - run: cargo test --workspace
        env:
          LATTICE_BIN: ${{ github.workspace }}/target/debug/lattice
          LATTICE_HARNESS_FAILURE_DIR: ${{ github.workspace }}/target/harness-failures
          # Cap link-time parallelism. The workspace links many large test
          # binaries (wasmtime, aws-lc-sys, gix, rusqlite), and at the default
          # job count the hosted runner ran out of memory mid-link:
          # `ld terminated with signal 7 [Bus error]`; the same failure still
          # reproduced at 2 jobs on ubuntu-latest during `cargo test --workspace`,
          # so CI uses a stricter cap here.
          CARGO_BUILD_JOBS: "1"
      # Dependency / architecture boundary checks (same contracts `cargo
      # xtask ci` runs locally).
      - run: cargo xtask harness-boundary
      - run: cargo xtask lancet-boundary
      - run: cargo xtask tool-codegen --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: harness-failures-${{ matrix.os }}
          path: target/harness-failures/
          if-no-files-found: ignore
