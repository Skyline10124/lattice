name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Linux is LATTICE's sole supported host. Do not add a platform matrix;
    # expanding the host contract requires a separate architecture decision.
    runs-on: ubuntu-latest
    # 本 job 的所有步骤都关闭调试信息。曾测得这里的调试测试二进制每个约 430 MB、共约 68 个
    # 测试目标，超出托管 runner 约 14 GB 的可用磁盘；lld 以 mmap 写输出，磁盘写满时触发
    # SIGBUS 而不是 ENOSPC，连续三次表现为 `ld terminated with signal 7 [Bus error]`。
    # 关闭后单个 crate 的产物从 24.4 MB 降到 2.0 MB；backtrace 保留函数名，只缺行号。
    #
    # Job-level (not per-step) so clippy/build/test share one profile: a debug
    # setting that differs between steps invalidates the cache and forces a full
    # rebuild, which would defeat the point.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      # Depth 2 brings the PR merge commit's base parent (HEAD^1).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
      # 只改 Markdown 的 PR 运行文档链接检查，跳过之后的 Rust 步骤；job 照常给出结论，
      # 所以每个 PR 都有 `check` 结果。diff 失败时 job 失败。push 到 main 时不运行这一步，
      # 输出为空，所有步骤都运行。
      - name: Detect docs-only PR
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if grep -qv '\.md$' <<<"$changed"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi
      # 文档链接检查由 xtask 执行，所以工具链与缓存对每个 PR 都准备。
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo xtask docs-check
      - run: cargo fmt --all --check
        if: steps.changes.outputs.code != 'false'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: steps.changes.outputs.code != 'false'
      - run: cargo build -p lattice-cli --bin lattice
        if: steps.changes.outputs.code != 'false'
      # One test step covers crate-local invariants AND every external-binary
      # scenario (fast_*, direct_* full-turn, pty_tui_smoke): the harness is a
      # workspace member, resolves the debug binary via LATTICE_BIN, and none
      # of its targets are #[ignore]-gated. Direct-Local scenarios run on any
      # host — no hypervisor, daemon, or container image required.
      - run: cargo test --workspace
        if: steps.changes.outputs.code != 'false'
        env:
          LATTICE_BIN: ${{ github.workspace }}/target/debug/lattice
          LATTICE_HARNESS_FAILURE_DIR: ${{ github.workspace }}/target/harness-failures
      # 第二轮：先检查测试专用 feature 的编译与 clippy，再用带测试 feature 的产物覆盖
      # target/debug/lattice（LATTICE_BIN 路径不变），运行假执行器单元测试、假工具场景与崩溃屏障。
      - run: cargo clippy -p lattice-api -p lattice-cli --all-targets --features test-fake-tools,test-crash-barriers -- -D warnings
        if: steps.changes.outputs.code != 'false'
      - run: cargo clippy -p lattice-system-harness --all-targets --features fake-tools,crash-barriers -- -D warnings
        if: steps.changes.outputs.code != 'false'
      - run: cargo build -p lattice-cli --bin lattice --features test-fake-tools,test-crash-barriers
        if: steps.changes.outputs.code != 'false'
      - run: cargo test -p lattice-api --features test-fake-tools,test-crash-barriers
        if: steps.changes.outputs.code != 'false'
      - run: cargo test -p lattice-system-harness --features fake-tools,crash-barriers
        if: steps.changes.outputs.code != 'false'
        env:
          LATTICE_BIN: ${{ github.workspace }}/target/debug/lattice
          LATTICE_HARNESS_FAILURE_DIR: ${{ github.workspace }}/target/harness-failures
      # Dependency / architecture boundary checks (same contracts `cargo
      # xtask ci` runs locally).
      - run: cargo xtask harness-boundary
        if: steps.changes.outputs.code != 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: harness-failures-ubuntu-latest
          path: target/harness-failures/
          if-no-files-found: ignore
