name: full-gate
on:
  # Triggers: this lane is long (locked release build + the full harness
  # against the release binary), so it does not gate every PR — the ordinary
  # CI lane does. It runs nightly for release evidence and on demand.
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  full-gate:
    # Linux is LATTICE's sole supported host. The rollout gate records host
    # capabilities without requiring virtualization.
    runs-on: ubuntu-latest
    # See ci.yml: debug test binaries overrun the hosted runner's disk and lld
    # dies with SIGBUS mid-link. Job-level so every step shares one profile.
    # `cargo xtask rollout` builds its own --locked --release artifact, which
    # is unaffected by these dev/test profile settings.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Everything the ordinary lane does.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build -p lattice-cli --bin lattice
      - run: cargo test --workspace
        env:
          LATTICE_BIN: ${{ github.workspace }}/target/debug/lattice
          LATTICE_HARNESS_FAILURE_DIR: ${{ github.workspace }}/target/harness-failures
      # 第二轮：先检查测试专用 feature 的编译与 clippy，再用带测试 feature 的产物覆盖
      # target/debug/lattice（LATTICE_BIN 路径不变），运行假执行器单元测试、假工具场景与崩溃屏障。
      # rollout 另行构建 target/release/lattice，不受此处覆盖 debug 产物影响。
      - run: cargo clippy -p lattice-api -p lattice-cli --all-targets --features test-fake-tools,test-crash-barriers -- -D warnings
      - run: cargo clippy -p lattice-system-harness --all-targets --features fake-tools,crash-barriers -- -D warnings
      - run: cargo build -p lattice-cli --bin lattice --features test-fake-tools,test-crash-barriers
      - run: cargo test -p lattice-api --features test-fake-tools,test-crash-barriers
      - run: cargo test -p lattice-system-harness --features fake-tools,crash-barriers
        env:
          LATTICE_BIN: ${{ github.workspace }}/target/debug/lattice
          LATTICE_HARNESS_FAILURE_DIR: ${{ github.workspace }}/target/harness-failures
      - run: cargo xtask harness-boundary
      - name: alpha rollout (locked release binary, JSON record)
        run: cargo xtask rollout --channel alpha
      # rollout 在被拒绝或失败时也会写出记录，因此无条件上传 target/rollout/
      #（含记录与 harness 失败 bundle）。
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rollout-alpha-record
          path: target/rollout/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: harness-failures-full-gate
          path: target/harness-failures/
          if-no-files-found: ignore
