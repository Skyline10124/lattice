[package]
name = "lattice-api"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "LATTICE thin public API facade for session creation, turn execution, and streaming"

[dependencies]
async-trait = { workspace = true }
lancet-api = { workspace = true }
chrono = { workspace = true }
lancet-protocol = { workspace = true }
lancet-authority = { workspace = true }
lattice-agent = { workspace = true }
lattice-conversation = { workspace = true }
lattice-llm = { workspace = true }
lattice-profile = { workspace = true }
lattice-session = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
unicode-width = { workspace = true }
uuid = { workspace = true }
libc = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
lattice-api = { workspace = true, features = ["test-utils"] }
gix = { workspace = true }
lattice-session = { workspace = true, features = ["test-utils", "test-support"] }
lattice-store = { workspace = true, features = ["test-fault-injection"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
lancet-runtime = { workspace = true, features = ["test-utils"] }
lattice-agent = { workspace = true, features = ["test-utils"] }
lattice-profile = { workspace = true }
blake3 = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }

[features]
default = []
# 仅供本 crate 与下游测试复用同进程 Turn 执行入口。
test-utils = []
test-crash-barriers = []
