[package]
name = "lancet-catalog"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "LANCET CEP method contracts, method params/results, descriptors, and static catalog"

[features]
default = []
inspect-scaffold = []
# Exposes `test_method::TestEcho`, a synthetic typed method for downstream test
# code that needs any `CepMethod` shape. Never enable in a production
# `[dependencies]` entry — only in `[dev-dependencies]`.
test-method = []

[dependencies]
lancet-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
