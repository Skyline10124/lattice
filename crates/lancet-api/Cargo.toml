[package]
name = "lancet-api"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "LANCET unified public API: CEP runtime composition and operator audit reads, independent of the LATTICE session/agent layers"

[dependencies]
lancet-protocol = { workspace = true }
lancet-catalog = { workspace = true }
lancet-dispatch = { workspace = true }
lancet-cep = { workspace = true }
lancet-audit = { workspace = true }
lancet-authority = { workspace = true }
lancet-native = { workspace = true }
lancet-runtime = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Normal dependency above; the dev-entry adds the `test-support` feature so
# test builds get `ScopedXdgStateHome` (shared XDG/env test isolation).
lancet-audit = { workspace = true, features = ["test-support"] }
lancet-catalog = { workspace = true }
# `test-utils` exposes `ComponentRuntime::noop_fixture()` for Component
# lifecycle tests.
lancet-runtime = { workspace = true, features = ["test-utils"] }
rusqlite = { workspace = true }
tempfile = { workspace = true }
