[package]
name = "lattice-local"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "LATTICE 本地前端客户端句柄、会话观察状态机与日志初始化"

[dependencies]
lattice-conversation = { workspace = true }
lattice-ipc = { workspace = true }
lattice-store = { workspace = true }
rustix = { workspace = true, features = ["fs", "process"] }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
lattice-ipc = { workspace = true, features = ["test-utils"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
test-utils = ["lattice-ipc/test-utils"]
