[package]
name = "lattice-workspace"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "LATTICE Upper-workspace execution adapter seam with a microsandbox (libkrun) backend (MVP)"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
# microsandbox SDK: keep `keyring` (dbus/keyring system deps) off, but enable
# `prebuilt` so the SDK's build.rs downloads the matching `msb` binary +
# libkrunfw into ~/.microsandbox/ at build time. Without `prebuilt`, no `msb`
# binary is produced anywhere (the crate bin is named `microsandbox`, not `msb`,
# and the SDK runtime looks for `msb`), so Upper creation fails with
# "msb binary not found" at turn time. `prebuilt` only adds the download step
# + microsandbox-utils/http-client; it does NOT pull keyring/dbus.
microsandbox = { version = "=0.5.6", default-features = false, features = ["net", "prebuilt"] }
# in-process git operations (baseline archive + DeterministicWorkspace)
git2 = { workspace = true }
# file credential exec-based injection (base64 encode on host)
base64 = { workspace = true }
# tempdir for git_archive_to_tempdir (production helper, not dev-only)
tempfile = { workspace = true }
regex = { workspace = true }

[[test]]
name = "promotion_recovery"
path = "tests/promotion_recovery.rs"

[[test]]
name = "promotion_lower"
path = "tests/promotion_lower.rs"

[[test]]
name = "promotion_ref_transaction"
path = "tests/promotion_ref_transaction.rs"

[[test]]
name = "promotion_candidate_validation"
path = "tests/promotion_candidate_validation.rs"
required-features = ["test-utils"]

[[test]]
name = "promotion_end_to_end"
path = "tests/promotion_end_to_end.rs"
required-features = ["test-utils"]

[[test]]
name = "git_status_z"
path = "tests/git_status_z.rs"

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# Enables DeterministicWorkspace and contract test helpers outside #[cfg(test)]
test-utils = []
# Gates live-KVM integration tests (require KVM + libkrunfw.so + reachable image registry).
# Implies test-utils so the contract suite (run_suite) is available in the integration lane.
integration_tests = ["test-utils"]

[[test]]
name = "workspace_primitives"
path = "tests/workspace_primitives.rs"
required-features = ["test-utils"]

[[test]]
name = "retained_snapshot"
path = "tests/retained_snapshot.rs"
required-features = ["test-utils"]
