[package]
name = "lattice-workspace"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "LATTICE Upper-workspace execution adapter seam with a microsandbox (libkrun) backend (MVP)"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
# microsandbox SDK (no prebuilt agentd download, no keyring/dbus)
microsandbox = { version = "=0.5.6", default-features = false, features = ["net"] }
# in-process git operations (baseline archive + DeterministicWorkspace)
git2 = { workspace = true }
# file credential exec-based injection (base64 encode on host)
base64 = { workspace = true }
# tempdir for git_archive_to_tempdir (production helper, not dev-only)
tempfile = { workspace = true }

[dev-dependencies]

[features]
default = []
# Enables DeterministicWorkspace and contract test helpers outside #[cfg(test)]
test-utils = []
# Gates live-KVM integration tests (require KVM + libkrunfw.so + reachable image registry).
# Implies test-utils so the contract suite (run_suite) is available in the integration lane.
integration_tests = ["test-utils"]
