[package]
name = "lattice-llm"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "LATTICE LLM vocabulary and function-call facade"

[dependencies]
net-guard = { workspace = true }
lattice-conversation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "time"] }
url = { workspace = true }
urlencoding = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }
zeroize = { workspace = true }
rustix = { workspace = true, features = ["process"] }
rustls-native-certs = "0.8.4"
rustls = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
# reqwest 已经依赖它们：自有协议层重发策略要识别 h2 错误，连接日志层要实现 tower 的 trait。
h2 = "0.4"
tower-layer = "0.3"
tower-service = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { workspace = true }

[features]
test-utils = []
