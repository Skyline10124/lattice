[package]
name = "lancet-runtime"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "ADR 0004 Component engine, closed composition gate, and minimal ToolHost for LATTICE Source Tools"

[features]
default = []
# Exposes a fixed no-op fixture constructor for cross-crate integration tests.
# Non-default: production binaries compose from inventory + generated
# EXPECTED_COMPONENTS, not from this helper.
test-utils = []
# Narrow one-shot install and post-install parent-fsync failure seams for the
# Local Workspace, used by mutation tests across the crate boundary. Never
# enabled by production binaries.
test-fault-injection = []

[dependencies]
wasmtime = { workspace = true }
inventory = { workspace = true }
lancet-protocol = { workspace = true }
# #30 moved the concrete Local Workspace down into this crate so the
# `workspace-observe` Tool Host imports can execute observation without reaching
# up a layer. The visibility *decision vocabulary* (`ReadVisibilityPolicy` /
# `HiddenReason` / `ReadVisibility`) and the System Path Exclusion predicate are
# authority semantics and stay in `lancet-authority`; this edge points down
# (Layer 2.5 -> Layer 2) and closes no cycle. Do not reimplement policy
# semantics here.
lancet-authority = { workspace = true }
# #32: GET-only network transport and SSRF enforcement live behind the
# `network-fetch` Tool Host import. `net-guard` stays the neutral URL/DNS leaf;
# HTTP/TLS construction and policy application stay here.
net-guard = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
url = { workspace = true }
# #143: the private WorkspaceHistory is a project-scoped store in the
# domain-neutral durability kernel (ADR 0005 §4 layer graph puts
# lancet-runtime -> lattice-store). Durability primitives — object writing,
# ref CAS, the repository write lock, retention, fsync barriers — belong to
# the kernel and must not be reimplemented here.
lattice-store = { workspace = true }
gix = { workspace = true }
libc = { workspace = true }
# Local Workspace filesystem primitives: `rustix` for the
# `openat2(RESOLVE_BENEATH | RESOLVE_NO_SYMLINKS)` resolution that makes root
# containment enforceable, `regex` for grep, `blake3` for the canonical content hash.
rustix = { workspace = true }
regex = { workspace = true }
blake3 = { workspace = true }
jsonschema = { workspace = true }
wasmparser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
wat = "1"
sha2 = { workspace = true }
tempfile = { workspace = true }

# Tests use the fixed no-op fixture constructor.
[dev-dependencies.lancet-runtime]
path = "."
features = ["test-utils"]
