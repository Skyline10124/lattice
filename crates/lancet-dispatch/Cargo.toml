[package]
name = "lancet-dispatch"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "LANCET CEP typed dispatch, in-process JSON-RPC transport, cancellation, and event sinks"

[dependencies]
lancet-protocol = { workspace = true }
lancet-catalog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# `test-method` provides the synthetic `TestEcho` typed method the registry and
# transport tests register. Dev-only: it must never reach a production build.
lancet-catalog = { workspace = true, features = ["test-method"] }
