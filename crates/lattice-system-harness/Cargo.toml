[package]
name = "lattice-system-harness"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
authors = ["Ast Rin"]
description = "面向已构建 lattice 二进制的全系统黑盒验收套件（零产品 crate 依赖）"
publish = false

[features]
fake-tools = []
crash-barriers = []

[[test]]
name = "direct_crash_barriers"
path = "tests/direct_crash_barriers.rs"
required-features = ["crash-barriers", "fake-tools"]

[dependencies]
# 通用哈希库（非产品 crate）：场景中二进制身份与工作区文件摘要核对使用。
blake3 = "1"
# 只启用 `sha1` 与 `tree-editor`，关闭默认特性以控制依赖体积。
gix = { version = "0.85", default-features = false, features = ["sha1", "tree-editor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tempfile = "3"
thiserror = "2"

# 为 TUI 冒烟场景提供伪终端支持（PTY 仅用于验证 TUI 入口仍接入同一条轮次链路）。
# `portable-pty` 是通用测试库而非产品 crate，满足 `cargo xtask harness-boundary` 要求。
#
# `libc` 通过 `killpg`/`getpgid` 直接投递进程组信号，替代派生带负进程组号参数的 `kill(1)`（#105）。
# 此处显式声明版本号而不从工作区继承：`cargo xtask harness-boundary` 禁止本清单使用工作区依赖继承。
portable-pty = "0.9"
libc = "0.2"

# 假 provider 与真实 provider 一样运行 TLS + HTTP/2；均属通用网络库，版本已在锁文件中固定。
bytes = "1"
h2 = "0.4"
http = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
