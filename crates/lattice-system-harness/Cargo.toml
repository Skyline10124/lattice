[package]
name = "lattice-system-harness"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
authors = ["Ast Rin"]
description = "External system tests for the lattice binary (no product crate dependencies)"
publish = false

[features]
release-operator = []
crash-barriers = []

[[test]]
name = "release_operator"
path = "tests/release_operator.rs"
required-features = ["release-operator"]

[[test]]
name = "direct_crash_barriers"
path = "tests/direct_crash_barriers.rs"
required-features = ["crash-barriers"]

[[test]]
name = "direct_rewind_crash_barriers"
path = "tests/direct_rewind_crash_barriers.rs"
required-features = ["crash-barriers"]

[dependencies]
# General hashing library (not a product crate): scenarios need the same
# Local Revision string the product computes to script `mutate.edit`
# preconditions through the fake LLM.
blake3 = "1"
gix = { version = "0.85", features = ["tree-editor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

# PTY support for the one or two TUI smoke scenarios (RFC #19 decision three:
# PTY only proves the TUI entrypoint still wires into the same turn chain).
# `portable-pty` is a general test library, not a product crate, so it
# satisfies `cargo xtask harness-boundary`.
#
# `libc` delivers process-group signals through `killpg`/`getpgid` instead of
# spawning `kill(1)` with a negative pgid argument (#105). The version is
# spelled out rather than inherited from the workspace: `cargo xtask
# harness-boundary` rejects workspace dependency inheritance in this manifest.
portable-pty = "0.9"
libc = "0.2"
