[package]
name = "lattice-system-harness"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
authors = ["Ast Rin"]
description = "External system tests for the lattice binary (no product crate dependencies)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

# PTY support for the one or two TUI smoke scenarios (RFC #19 decision three:
# PTY only proves the TUI entrypoint still wires into the same turn chain).
# `portable-pty` is a general test library, not a product crate, so it
# satisfies `cargo xtask harness-boundary`. Unix-only target gating keeps
# the Windows PTY backend out of the dependency graph on the committed
# platforms.
[target.'cfg(unix)'.dependencies]
portable-pty = "0.9"

