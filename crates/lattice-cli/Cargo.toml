[package]
name = "lattice-cli"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "LATTICE CLI"

[[bin]]
name = "lattice"
path = "src/main.rs"

[dependencies]
lattice-session = { workspace = true }
lattice-profile = { workspace = true }
lattice-api = { workspace = true }
lancet-api = { workspace = true }
lancet-protocol = { workspace = true }
lancet-catalog = { workspace = true }
lancet-authority = { workspace = true }
lancet-invariants = { workspace = true }
lancet-native = { workspace = true }
lattice-llm = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
colored = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }

[dev-dependencies]
lattice-agent = { workspace = true, features = ["test-utils"] }
async-trait = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
