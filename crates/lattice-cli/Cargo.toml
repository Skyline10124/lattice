[package]
name = "lattice-cli"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "LATTICE CLI"

[[bin]]
name = "lattice"
path = "src/main.rs"

[dependencies]
lattice-api = { workspace = true }
lattice-session = { workspace = true }
lattice-tui = { workspace = true }
lancet-api = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
colored = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
unicode-width = { workspace = true }
dotenvy = { workspace = true }
url = { workspace = true }

[dev-dependencies]
lancet-audit = { workspace = true, features = ["test-support"] }
lattice-agent = { workspace = true, features = ["test-utils"] }
lattice-profile = { workspace = true }
lattice-llm = { workspace = true }
lattice-session = { workspace = true, features = ["test-utils"] }
async-trait = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
test-crash-barriers = ["lattice-api/test-crash-barriers"]
