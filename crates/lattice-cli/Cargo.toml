[package]
name = "lattice-cli"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "LATTICE CLI"

[[bin]]
name = "lattice"
path = "src/main.rs"

[dependencies]
lattice-local = { workspace = true }
lattice-tui = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
unicode-width = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true, features = ["fs"] }
zeroize = { workspace = true }

[dev-dependencies]
lattice-local = { workspace = true, features = ["test-utils"] }
lattice-session = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
