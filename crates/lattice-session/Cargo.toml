[package]
name = "lattice-session"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "LATTICE session graph and git-style conversation refs"

[dependencies]
chrono = { workspace = true, features = ["serde"] }
redb = { workspace = true }
rustix = { workspace = true }
lancet-protocol = { workspace = true }
lattice-conversation = { workspace = true }
lattice-store = { workspace = true }
gix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
lattice-store = { workspace = true, features = ["test-fault-injection"] }
tempfile = { workspace = true }

[features]
default = []
# Shared git fixture helpers for downstream crate tests.
test-utils = []
test-support = ["dep:tempfile"]
