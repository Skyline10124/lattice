[package]
name = "lattice-session"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "LATTICE 全局事务会话库"

[dependencies]
chrono = { workspace = true, features = ["serde"] }
redb = { workspace = true }
rustix = { workspace = true }
lancet-protocol = { workspace = true }
lattice-conversation = { workspace = true }
lattice-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
# 下游隔离测试使用的存储故障接缝与消息构造。
test-utils = []
# 仅显式外部故障产物复用提交失败接缝，不启用其余测试构造器。
test-crash-barriers = []
