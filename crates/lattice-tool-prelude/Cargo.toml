[package]
name = "lattice-tool-prelude"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "Guest-side SDK for LATTICE Source Tools: generated WIT bindings re-export, Component export glue, and descriptor/Cell helpers. Exposes no host internals."

[features]
default = []

[dependencies]
# Re-export of the workspace-pinned generator. Guest Tools also take a direct
# `wit-bindgen` dependency because `generate!` emits `wit_bindgen::rt::...` by
# bare crate path (FINDINGS.md L-5-02 / #73); the single `=` pin in
# `[workspace.dependencies]` is what keeps both paths on one version.
wit-bindgen = { workspace = true }
