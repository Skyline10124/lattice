[package]
name = "lancet-native"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "LANCET native production handlers, transport integration, verify, edit, shell, and web"

[dependencies]
net-guard = { workspace = true }
lancet-protocol = { workspace = true }
lancet-catalog = { workspace = true }
lancet-dispatch = { workspace = true }
lancet-audit = { workspace = true }
lancet-authority = { workspace = true }
lancet-runtime = { workspace = true }
schemars = { workspace = true }
blake3 = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
libc = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
gix = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
# `test-fault-injection` moved down with the Local Workspace in #30: the
# one-shot install and post-install fsync failure flags now live on
# `lancet_runtime::LocalWorkspace`,
# and this crate's tests are a separate compilation unit, so the seam has to be a
# feature rather than `cfg(test)`. `test-utils` carries the history-less
# `LocalWorkspace::new` those same tests construct with.
lancet-runtime = { workspace = true, features = ["test-utils", "test-fault-injection"] }

[features]
default = []
inspect-scaffold = ["lancet-catalog/inspect-scaffold"]
# Narrow LocalWorkspace mutation-failure injection for integration tests.
# Enables only one-shot install and parent-fsync flags; not a plugin seam.
# Since #30 the flag lives in `lancet-runtime`, so this forwards there.
test-fault-injection = ["lancet-runtime/test-fault-injection"]
