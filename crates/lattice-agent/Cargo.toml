[package]
name = "lattice-agent"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "Agent state, prompt assembly, and memory management"

[dependencies]
lattice-core = { workspace = true }
lattice-hooks = { workspace = true }
lattice-llm = { workspace = true }
lattice-policy = { workspace = true }
lattice-prompt = { workspace = true }
lattice-sandbox = { workspace = true }
lattice-session = { workspace = true }
lattice-tools = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = []
blob-store = ["dep:sqlx", "lattice-tools/blob-store"]
sqlite-memory = ["dep:rusqlite"]
