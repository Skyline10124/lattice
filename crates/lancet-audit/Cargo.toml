[package]
name = "lancet-audit"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "LANCET authoritative Git invocation ledger and operator reads"

[dependencies]
lancet-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
lattice-store = { workspace = true }
gix = { workspace = true }
# Optional: only compiled into non-test builds when `test-support` is enabled.
tempfile = { workspace = true, optional = true }

[features]
# Exposes `ScopedXdgStateHome` (src/test_support.rs) to downstream test code
# (lattice-api / lattice-cli dev-dependencies). Pulls in `tempfile` for
# non-test builds of this crate; plain `cargo test -p lancet-audit` gets the
# module via `cfg(test)` and the dev-dependency instead.
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile = { workspace = true }
lattice-store = { workspace = true, features = ["test-fault-injection"] }
lattice-conversation = { workspace = true }
# Non-production only. ADR 0005 §19's graph has no `lancet-audit ->
# lattice-session` edge: the cross-domain facts projection and the collision
# executor live in `tests/invocation_qualification.rs`, never in this crate's
# production surface, so `lancet-api` cannot reach LATTICE session types
# through audit.
lattice-session = { workspace = true }
