[package]
name = "lancet-audit"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
description = "LANCET CEP audit store, query filters, row model, stage labels, and attestation persistence"

[dependencies]
lancet-protocol = { workspace = true }
lancet-catalog = { workspace = true }
blake3 = { workspace = true }
dirs = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Optional: only compiled into non-test builds when `test-support` is enabled.
tempfile = { workspace = true, optional = true }

[features]
# Exposes `ScopedXdgStateHome` (src/test_support.rs) to downstream test code
# (lattice-api / lattice-cli dev-dependencies). Pulls in `tempfile` for
# non-test builds of this crate; plain `cargo test -p lancet-audit` gets the
# module via `cfg(test)` and the dev-dependency instead.
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile = { workspace = true }
