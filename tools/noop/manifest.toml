# Sole Tool Descriptor authority (ADR 0004 §2). Everything else is generated.
[tool]
name = "noop.echo"
version = "0.1.0"
description = "Tracer no-op: emits progress/cancellation and echoes params."
abi-version = 1

[params]
schema = '''
{
  "type": "object",
  "properties": { "message": { "type": "string" } },
  "required": ["message"],
  "additionalProperties": false
}
'''

[result]
schema = '''
{
  "type": "object",
  "properties": { "echoed": { "type": "string" } },
  "required": ["echoed"],
  "additionalProperties": false
}
'''

[[scopes]]
name = "session"
trust = "in"
channel = "session"

[[capabilities]]
name = "session.result"
cell = "alloc:none:session"

