# Sole Tool Descriptor authority (ADR 0004 §2). Everything else is generated.
[tool]
name = "noop.echo"
version = "0.1.0"
description = "Tracer no-op: emits progress/cancellation and echoes params."
abi-version = 1
# `fixture` keeps the tracer out of the default distribution: it is composed only
# by the `test-utils` no-op fixture, never embedded in a built runtime's closed
# catalog (ADR 0004 decision 1: the default distribution is five Tools).
distribution = "fixture"

[params]
schema = '''
{
  "type": "object",
  "properties": { "message": { "type": "string" } },
  "required": ["message"],
  "additionalProperties": false
}
'''

[result]
schema = '''
{
  "type": "object",
  "properties": { "echoed": { "type": "string" } },
  "required": ["echoed"],
  "additionalProperties": false
}
'''

# Presentation intent (#113). Annotations bind fields only: no rows, columns,
# positions, or nesting — the presentation primitives belong to the consumer.
# This section is the format-validation sample, so it stays inside what the
# no-op schemas actually declare: `echoed` is the one result field, and it is
# what summarizes the call. `render.json` is a projection artifact and is
# deliberately outside the descriptor identity chain: adding this section leaves
# descriptor.json, descriptor-sha256, expected-identity.json and the Component
# bytes byte-identical.
[[render.annotations]]
role = "summary"
path = "result.echoed"

[[scopes]]
name = "session"
trust = "in"
channel = "session"

[[capabilities]]
name = "session.result"
cell = "alloc:none:session"

# The guest calls `host-control::emit-event`; the host binds that operation to
# Cell{Mutate, None, <session-channel scope>}, so the capability must be
# declared for the operation to be admissible.
[[capabilities]]
name = "session.events"
cell = "mutate:none:session"

[artifact]
# Written by `cargo xtask tool-build`; verified by the composition gate.
sha256 = "b677a9b339c4703d8a02af54def031509ff17d73c66a83fc59176a528d646f08"
# The encoder belongs in this fingerprint: `wasm-tools component new` determines
# the resulting Component bytes, so the sha256 above is only interpretable
# alongside it (#80). `cargo xtask ci` asserts the installed encoder matches
# `EXPECTED_WASM_TOOLS`.
toolchain = "rustc-1.96.0+wit-bindgen-0.59+wasm-tools-1.254.0"
