# Sole Tool Descriptor authority (ADR 0004 §2) for `mutate.edit`.
# Everything else is generated from this file by `cargo xtask tool-codegen`.

imports = ["workspace-mutate"]

[tool]
name = "mutate.edit"
version = "0.1.0"
description = "Edit an existing file with semantic text operations. The target path must be permitted by policy: use a 'dir/**' pattern to cover a directory (a pattern without /** matches only one exact file). Provide the path, the observe.workspace content_hash as expected_hash, and an edits array where every operation object includes op plus its required fields: replace_text uses old/new, insert_before and insert_after use anchor/content. Put multiple changes to the same file in one mutate.edit edits array. LANCET computes hashline anchors internally. This method never deletes files."
abi-version = 1
distribution = "builtin"

[params]
schema = '''
{
  "type": "object",
  "properties": {
    "path": { "type": "string", "minLength": 1 },
    "expected_hash": { "type": "string", "minLength": 1 },
    "edits": {
      "type": "array",
      "minItems": 1,
      "items": {
        "oneOf": [
          {
            "type": "object",
            "properties": {
              "op": { "const": "replace_text" },
              "old": { "type": "string" },
              "new": { "type": "string" },
              "occurrence": { "type": "integer", "minimum": 1 }
            },
            "required": ["op", "old", "new"],
            "additionalProperties": false
          },
          {
            "type": "object",
            "properties": {
              "op": { "const": "insert_before" },
              "anchor": { "type": "string" },
              "content": { "type": "string" },
              "occurrence": { "type": "integer", "minimum": 1 }
            },
            "required": ["op", "anchor", "content"],
            "additionalProperties": false
          },
          {
            "type": "object",
            "properties": {
              "op": { "const": "insert_after" },
              "anchor": { "type": "string" },
              "content": { "type": "string" },
              "occurrence": { "type": "integer", "minimum": 1 }
            },
            "required": ["op", "anchor", "content"],
            "additionalProperties": false
          }
        ]
      }
    }
  },
  "required": ["path", "expected_hash", "edits"],
  "additionalProperties": false
}
'''

[result]
schema = '''
{
  "type": "object",
  "properties": {
    "changed_files": {
      "type": "array",
      "items": { "type": "string" }
    }
  },
  "required": ["changed_files"],
  "additionalProperties": false
}
'''

[[scopes]]
name = "workspace"
trust = "in"
channel = "workspace"

[[capabilities]]
name = "workspace.mutation"
cell = "mutate:write:workspace"

[[capabilities]]
name = "workspace.mutation.result"
cell = "alloc:write:workspace"

[artifact]
sha256 = "bf47ad5bbe3cfa6ba276e7dcb8367c10a45139a48e88ffa54c70ae70854b33ae"
toolchain = "rustc-1.96.0+wit-bindgen-0.59+wasm-tools-1.254.0"
