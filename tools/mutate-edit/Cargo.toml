[package]
# `cargo xtask tool-build` derives the package name from the manifest's tool
# name by replacing `__` with a dash (`mutate__edit` -> `mutate-edit`).
name = "mutate-edit"
version = "0.1.0"
license.workspace = true
edition.workspace = true
authors.workspace = true
publish = false
description = "mutate__edit Source Tool: semantic edits then replace-with-expected over workspace-mutate."

[lib]
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
lattice-tool-prelude = { workspace = true }
wit-bindgen = { workspace = true }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
mutate-shared = { path = "../mutate-shared" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
