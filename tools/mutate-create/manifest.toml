# Sole Tool Descriptor authority (ADR 0004 §2) for `mutate.create`.
# Everything else is generated from this file by `cargo xtask tool-codegen`.

imports = ["workspace-mutate"]

[tool]
name = "mutate.create"
version = "0.1.0"
description = "Create a new file under the workspace write scope. The target path must be permitted by policy: use a 'dir/**' pattern to cover a directory. The target file must not already exist. Set create_parents=true to create missing parent directories required for path; otherwise parent directories must already exist."
abi-version = 1
distribution = "builtin"

[params]
schema = '''
{
  "type": "object",
  "properties": {
    "path": { "type": "string", "minLength": 1 },
    "content": { "type": "string" },
    "create_parents": { "type": "boolean" }
  },
  "required": ["path", "content"],
  "additionalProperties": false
}
'''

[result]
schema = '''
{
  "type": "object",
  "properties": {
    "path": { "type": "string" },
    "bytes_written": { "type": "integer", "minimum": 0 },
    "created_dirs": {
      "type": "array",
      "items": { "type": "string" }
    }
  },
  "required": ["path", "bytes_written"],
  "additionalProperties": false
}
'''

[[scopes]]
name = "workspace"
trust = "in"
channel = "workspace"

[[capabilities]]
name = "workspace.mutation"
cell = "mutate:write:workspace"

[[capabilities]]
name = "workspace.mutation.result"
cell = "alloc:write:workspace"

[artifact]
sha256 = "fc850581493f0574ea4e1999d112637fe0b74d2b4fe20ab74d49a01f60016119"
toolchain = "rustc-1.96.0+wit-bindgen-0.60+wasm-tools-1.254.0"
