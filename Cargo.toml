[workspace]
resolver = "3"
members = [
    "crates/net-guard",
    "crates/lattice-store",
    "crates/lattice-ipc",
    "crates/lattice-local",
    "crates/lattice-llm",
    "crates/lattice-server",
    "crates/lattice-session",
    "crates/lattice-conversation",
    "crates/lattice-agent",
    "crates/lattice-tui",
    "crates/lattice-cli",
    "crates/lattice-profile",
    "crates/lattice-system-harness",
    "xtask",
]

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.94"
authors = ["Ast Rin"]

[workspace.dependencies]
# Internal crates
net-guard       = { path = "crates/net-guard" }
lattice-store    = { path = "crates/lattice-store" }
lattice-ipc      = { path = "crates/lattice-ipc" }
lattice-local    = { path = "crates/lattice-local" }
lattice-llm      = { path = "crates/lattice-llm" }
lattice-server   = { path = "crates/lattice-server" }
lattice-session  = { path = "crates/lattice-session" }
lattice-conversation = { path = "crates/lattice-conversation" }
lattice-agent    = { path = "crates/lattice-agent" }
lattice-tui      = { path = "crates/lattice-tui" }
lattice-profile  = { path = "crates/lattice-profile" }

# External dependencies — shared versions
async-trait = "0.1"
chrono = "0.4"
futures = "0.3"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
redb = "4.3.0"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
url = "2"
unicode-width = "0.2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
libc = "0.2"
# 凭据文件读写与所有权核验（`lattice-llm`：openat/renameat/unlinkat/geteuid）、
# 本地 IPC 对端身份核验（`lattice-ipc`：geteuid/socket_peercred）、
# 会话库创建时带 `NOREPLACE` 的原子发布重命名（`lattice-session`），以及测试构造 FIFO。
rustix = { version = "1.1.4", features = ["fs"] }
rustls = "0.23"
tokio-rustls = "0.26"
bytes = "1"

# CLI dependencies
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6"
colored = "3.1"
anyhow = "1"
base64 = "0.22"
ratatui = "0.30"
pulldown-cmark = { version = "0.13.4", default-features = false }
syntect = { version = "5.3", default-features = false }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# Dev dependencies
tempfile = "3"

[profile.bench]
lto = true
