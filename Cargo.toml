[workspace]
resolver = "3"
members = [
    "crates/net-guard",
    "crates/lattice-store",
    "crates/lattice-llm",
    "crates/lattice-api",
    "crates/lattice-session",
    "crates/lattice-conversation",
    "crates/lattice-agent",
    "crates/lancet-protocol",
    "crates/lancet-authority",
    "crates/lancet-api",
    "crates/lattice-tui",
    "crates/lattice-cli",
    "crates/lattice-profile",
    "crates/lattice-tool-prelude",
    "crates/lancet-runtime",
    "crates/lattice-system-harness",
    "tools/fetch-web",
    "tools/noop",
    "tools/observe-workspace",
    "tools/mutate-shared",
    "tools/mutate-create",
    "tools/mutate-edit",
    "tools/todo-write",
    "xtask",
]

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.94"
authors = ["Ast Rin"]

[workspace.dependencies]
# Internal crates
net-guard       = { path = "crates/net-guard" }
lattice-store    = { path = "crates/lattice-store" }
lattice-llm      = { path = "crates/lattice-llm" }
lattice-api      = { path = "crates/lattice-api" }
lattice-session  = { path = "crates/lattice-session" }
lattice-conversation = { path = "crates/lattice-conversation" }
lattice-agent    = { path = "crates/lattice-agent" }
lancet-protocol = { path = "crates/lancet-protocol" }
lancet-authority = { path = "crates/lancet-authority" }
lancet-api      = { path = "crates/lancet-api" }
lancet-runtime  = { path = "crates/lancet-runtime" }
lattice-tui      = { path = "crates/lattice-tui" }
lattice-cli      = { path = "crates/lattice-cli" }
lattice-profile  = { path = "crates/lattice-profile" }
lattice-tool-prelude = { path = "crates/lattice-tool-prelude" }

# External dependencies — shared versions
async-trait = "0.1"
blake3 = "1"
chrono = "0.4"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
indexmap = "2"
redb = "4.3.0"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
url = "2"
unicode-width = "0.2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
libc = "0.2"
# fd-relative filesystem operations (openat/mkdirat/renameat/unlinkat) for
# the TOCTOU-safe Local Workspace write path (#39).
rustix = { version = "1.1.4", features = ["fs"] }
rustls = "0.23"
rustls-platform-verifier = "0.7"
tokio-rustls = "0.26"
gix = { version = "0.85", features = ["tree-editor"] }
schemars = "1.2"
bytes = "1"
# Component Tool engine (ADR 0004 / #5 slice C). Pinned exactly; wasmtime
# major bumps change the component-model API surface. No wasmtime-wasi.
wasmtime = { version = "=46.0.1", default-features = false, features = [
  "async", "component-model", "cranelift", "runtime", "std", "wit-parser"
] }
inventory = "=0.3.24"
jsonschema = "=0.48.1"
# Source Tool guest bindings generator. Exact-pinned for the same reason as
# wasmtime: its `generate!` output shapes the guest's core module, so a patch
# bump changes the committed `.wasm` bytes and the digest the composition gate
# verifies. Declared here so the prelude and every guest Tool share one pin.
wit-bindgen = "=0.59.0"
# Component binary parser for import inspection in the composition gate.
wasmparser = "0.251"

# CLI dependencies
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6"
colored = "3.1"
anyhow = "1"
base64 = "0.22"
dotenvy = "0.15"
toml_edit = "0.25"
ratatui = "0.30"
pulldown-cmark = { version = "0.13.4", default-features = false }
syntect = { version = "5.3", default-features = false }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# Exact-pinned: 18.0.1 is <7 days old at adoption time; bump only after
# re-reviewing the readline behavior surface.
rustyline = "=18.0.0"

# Dev dependencies
tempfile = "3"

[profile.bench]
lto = true

# Debug builds run Wasmtime's Cranelift unoptimized, so composing the embedded
# Tool Components took ~6.8 s per process (release: ~0.55 s) and pushed Turn
# tests past their 10 s handoff timeouts. Optimizing only the compiler crates
# measured ~0.73 s while workspace crates stay fast to rebuild.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

# Keep workspace crates fast to rebuild while optimizing dependencies: an unoptimized
# Wasmtime Component compiler added about six seconds before every mock response.
[profile.tui-mock]
inherits = "dev"
opt-level = 0

[profile.tui-mock.package."*"]
opt-level = 1
