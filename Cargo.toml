[workspace]
resolver = "3"
members = [
    "crates/net-guard",
    "crates/lattice-llm",
    "crates/lattice-api",
    "crates/lattice-session",
    "crates/lattice-agent",
    "crates/lancet-protocol",
    "crates/lancet-catalog",
    "crates/lancet-dispatch",
    "crates/lancet-cep",
    "crates/lancet-audit",
    "crates/lancet-authority",
    "crates/lancet-native",
    "crates/lancet-api",
    "crates/lattice-tui",
    "crates/lattice-cli",
    "crates/lattice-profile",
    "crates/lattice-tool-prelude",
    "crates/lancet-runtime",
    "crates/lattice-system-harness",
    "tools/noop",
    "tools/observe-workspace",
    "tools/mutate-shared",
    "tools/mutate-create",
    "tools/mutate-edit",
    "tools/todo-write",
    "xtask",
]

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.94"
authors = ["Ast Rin"]

[workspace.dependencies]
# Internal crates
net-guard       = { path = "crates/net-guard" }
lattice-llm      = { path = "crates/lattice-llm" }
lattice-api      = { path = "crates/lattice-api" }
lattice-session  = { path = "crates/lattice-session" }
lattice-agent    = { path = "crates/lattice-agent" }
lancet-protocol = { path = "crates/lancet-protocol" }
lancet-catalog  = { path = "crates/lancet-catalog" }
lancet-dispatch = { path = "crates/lancet-dispatch" }
lancet-cep      = { path = "crates/lancet-cep" }
lancet-audit    = { path = "crates/lancet-audit" }
lancet-authority = { path = "crates/lancet-authority" }
lancet-native   = { path = "crates/lancet-native" }
lancet-api      = { path = "crates/lancet-api" }
lancet-runtime  = { path = "crates/lancet-runtime" }
lattice-tui      = { path = "crates/lattice-tui" }
lattice-cli      = { path = "crates/lattice-cli" }
lattice-profile  = { path = "crates/lattice-profile" }
lattice-tool-prelude = { path = "crates/lattice-tool-prelude" }

# External dependencies — shared versions
async-trait = "0.1"
blake3 = "1"
chrono = "0.4"
futures = "0.3"
indexmap = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
url = "2"
unicode-width = "0.2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
zeroize = { version = "1", features = ["derive"] }
libc = "0.2"
# fd-relative filesystem ops (openat/mkdirat/renameat/unlinkat) for the
# TOCTOU-safe Local Workspace write path (#39). Portable across Linux and
# macOS — deliberately no Linux-only openat2/RESOLVE_BENEATH usage.
rustix = { version = "1.1.4", features = ["fs"] }
gix = { version = "0.85", features = ["tree-editor"] }
schemars = "1.2"
bytes = "1"
# Component Tool engine (ADR 0004 / #5 slice C). Pinned exactly; wasmtime
# major bumps change the component-model API surface. No wasmtime-wasi.
wasmtime = { version = "=46.0.1", default-features = false, features = [
  "async", "component-model", "cranelift", "runtime", "std", "wit-parser"
] }
inventory = "=0.3.24"
jsonschema = "=0.48.1"
# Source Tool guest bindings generator. Exact-pinned for the same reason as
# wasmtime: its `generate!` output shapes the guest's core module, so a patch
# bump changes the committed `.wasm` bytes and the digest the composition gate
# verifies. Declared here so the prelude and every guest Tool share one pin.
wit-bindgen = "=0.59.0"
# Component binary parser for import inspection in the composition gate.
wasmparser = "0.251"

# CLI dependencies
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6"
colored = "3.1"
anyhow = "1"
base64 = "0.22"
dotenvy = "0.15"
toml_edit = "0.25"
ratatui = "0.30"
# Exact-pinned: 18.0.1 is <7 days old at adoption time; bump only after
# re-reviewing the readline behavior surface.
rustyline = "=18.0.0"

# Dev dependencies
tempfile = "3"
proptest = "1"

[profile.bench]
lto = true
