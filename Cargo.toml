[workspace]
resolver = "2"
members = [
    "crates/lattice-llm",
    "crates/lattice-api",
    "crates/lattice-session",
    "crates/lattice-agent",
    "crates/lancet-protocol",
    "crates/lancet-catalog",
    "crates/lancet-dispatch",
    "crates/lancet-cep",
    "crates/lancet-audit",
    "crates/lancet-authority",
    "crates/lancet-native",
    "crates/lancet-api",
    "crates/lattice-tui",
    "crates/lattice-cli",
    "crates/lattice-profile",
    "crates/lattice-workspace",
]

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"
authors = ["Ast Rin"]

[workspace.dependencies]
# Internal crates
lattice-llm      = { path = "crates/lattice-llm" }
lattice-api      = { path = "crates/lattice-api" }
lattice-session  = { path = "crates/lattice-session" }
lattice-agent    = { path = "crates/lattice-agent" }
lancet-protocol = { path = "crates/lancet-protocol" }
lancet-catalog  = { path = "crates/lancet-catalog" }
lancet-dispatch = { path = "crates/lancet-dispatch" }
lancet-cep      = { path = "crates/lancet-cep" }
lancet-audit    = { path = "crates/lancet-audit" }
lancet-authority = { path = "crates/lancet-authority" }
lancet-native   = { path = "crates/lancet-native" }
lancet-api      = { path = "crates/lancet-api" }
lattice-tui      = { path = "crates/lattice-tui" }
lattice-cli      = { path = "crates/lattice-cli" }
lattice-profile  = { path = "crates/lattice-profile" }

# External dependencies — shared versions
async-trait = "0.1"
blake3 = "1"
# Exact-pinned: the shell_ast whitelist walker in lancet-authority must be
# re-reviewed against the AST surface before any version bump.
brush-parser = "=0.4.0"
chrono = "0.4"
futures = "0.3"
indexmap = "2"
regex = "1"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
url = "2"
unicode-width = "0.1"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zeroize = { version = "1", features = ["derive"] }
libc = "0.2"
schemars = "0.8"

# CLI dependencies
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "5"
colored = "2"
anyhow = "1"
base64 = "0.22"
dotenvy = "0.15"
toml_edit = "0.22"
ratatui = "0.29"

# Dev dependencies
tempfile = "3"

[profile.bench]
lto = true
