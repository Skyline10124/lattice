[package]
name = "lattice-cli"
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "lattice"
path = "src/main.rs"

[dependencies]
lattice-core = { path = "../lattice-core" }
lattice-agent = { path = "../lattice-agent" }
lattice-harness = { path = "../lattice-harness" }
lattice-plugin = { path = "../lattice-plugin" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
colored = "2"
anyhow = "1"
reqwest = { version = "0.12", features = ["rustls-tls"] }
futures = "0.3"
chrono = "0.4"
dotenvy = "0.15"
sha2 = "0.10"
toml_edit = "0.22"

[features]
blob-store = ["lattice-agent/blob-store"]
