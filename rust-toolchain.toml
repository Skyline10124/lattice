# Deterministic toolchain pin for LATTICE (ADR 0004 / #5 slice B decision 1).
# rustc 1.96.0 is the build-verified compiler; `wasm32-unknown-unknown` is the
# Source Tool guest target. `--remap-path-prefix` for bit-for-bit reproducible
# Component artifacts is applied by `cargo xtask tool-build`, not here, so the
# remap stays explicit in the one build step that produces committed `.wasm`.
[toolchain]
channel = "1.96.0"
profile = "default"
targets = ["wasm32-unknown-unknown"]
